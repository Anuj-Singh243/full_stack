<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Form Container -->
  <rect x="50" y="40" width="300" height="220" fill="white" rx="15" shadow="0 10px 30px rgba(0,0,0,0.2)"/>
  
  <!-- Title -->
  <text x="200" y="70" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">User Information Form</text>
  
  <!-- Form Fields -->
  <!-- First Name Field -->
  <text x="70" y="95" font-size="12" font-weight="600" fill="#333">First Name</text>
  <rect x="70" y="100" width="130" height="25" fill="#f0f0f0" rx="6" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Last Name Field -->
  <text x="210" y="95" font-size="12" font-weight="600" fill="#333">Last Name</text>
  <rect x="210" y="100" width="130" height="25" fill="#f0f0f0" rx="6" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Email Field -->
  <text x="70" y="145" font-size="12" font-weight="600" fill="#333">Date of Birth</text>
  <rect x="70" y="150" width="130" height="25" fill="#f0f0f0" rx="6" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Skills Field -->
  <text x="210" y="145" font-size="12" font-weight="600" fill="#333">Skills</text>
  <rect x="210" y="150" width="130" height="25" fill="#f0f0f0" rx="6" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Address Field -->
  <text x="70" y="195" font-size="12" font-weight="600" fill="#333">Address</text>
  <rect x="70" y="200" width="270" height="30" fill="#f0f0f0" rx="6" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Submit Button -->
  <rect x="70" y="245" width="130" height="32" fill="#667eea" rx="8"/>
  <text x="135" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Submit</text>
  
  <!-- Reset Button -->
  <rect x="210" y="245" width="130" height="32" fill="#f5576c" rx="8"/>
  <text x="275" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Reset</text>
</svg>